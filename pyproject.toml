[build-system]
requires = ["setuptools==81.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lcc-context-engine"
version = "0.1.0"
description = "Specialized local context ranking and outcome research for LCC"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*.txt"]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
research = [
  "torch==2.12.0", "transformers==5.10.2", "numpy==2.4.6",
  "tiktoken==0.13.0", "huggingface-hub==1.18.0", "safetensors==0.7.0",
  "tokenizers==0.22.2",
]
baselines = ["laya==0.3.4"]

[project.scripts]
lcc-context-engine = "lcc_engine.__main__:main"

[tool.setuptools]
packages = ["lcc_engine", "specialist", "bakeoff", "replay", "research"]
